services:
  - type: web
    name: python-ai-chat-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: python-ai-chat-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: "http://localhost:4200,https://python-ai-app.pages.dev"

databases:
  - name: python-ai-chat-db
    plan: free
